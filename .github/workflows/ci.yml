name: Elite Unit — regression suite

# The unit that builds and merges Roman's code is itself guarded here: every push to dev/main and every
# PR runs the whole tests/ suite. A red run means a regression in the orchestrator — fix it before it
# reaches the 24/7 server (which self-updates from main).

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: tests/run_all.py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the REAL dependency manifest. The old hardcoded trio (Flask PyYAML requests) relied
      # on "harnesses stub the SDK" — no longer true: eu184's self-update smoke imports the service
      # entry modules UNSTUBBED by design, and eu199 drives pytest. The mismatch made CI permanently
      # red (ModuleNotFoundError: claude_agent_sdk / pytest) while the suite passed locally (2026-07-10).
      - name: Install runtime deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run the unit's own regression suite
        run: python tests/run_all.py
