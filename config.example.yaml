# ===========================================================================
# The General — example config. Copy to config.yaml and edit.
# Secrets do NOT go here (see .env.example): ANTHROPIC_API_KEY, JIRA_*.
# Keep config.yaml and audit.jsonl OUTSIDE every target repo.
# ===========================================================================

# --- the two officers (role asymmetry: a strong reviewer is worth it) ---
builder_model: "claude-sonnet-5"
reviewer_model: "claude-opus-4-8"

builder_effort: "high"            # low | medium | high | max (thinking depth)
reviewer_effort: "high"
escalate_effort_on_retry: false   # OFF (2026-07-05 audit): 135/135 round-2+ review objections were NEW — effort
                                  # escalation on retry bought context bloat, not convergence. Retry keeps the
                                  # pass-1 effort and turn budget; the Sonnet->Opus MODEL ladder on retry is a
                                  # separate, intended mechanism and stays on.

# --- loop bounds / cost ---
max_iterations: 2            # build<->review cycles before escalating to you (hard-clamped to 2 in loop.py)
max_cost_usd: 0             # 0 = no cap (subscription/Max). Set a number only for per-token API billing.
max_tickets_per_run: 1      # per app; raise once you trust it

# --- EU-221: per-call wall-clock timeout ---
# Bounds ONE agent call's SDK stream consumption, independent of max_turns — a stalled provider
# stream (GLM/z.ai has been observed hanging with zero output) can otherwise pin a drain for 30+
# min even on a 3-turn planner call. On expiry the CLI subprocess is terminated and the call
# returns a clean error (no exception) so the normal fail-safe paths handle it like any other
# officer/builder error.
officer_timeout_s: 900       # planner/reviewer/pm/adjutant/council/etc. (low-effort roles), seconds
builder_timeout_s: 3600      # builder — real code changes legitimately run long, seconds

# --- usage governor: daily token budget (autopilot auto-pause) ---
# On the Max plan there's no per-call dollar charge, so the meaningful runaway guard is TOKEN
# throughput. The autopilot sums today's ledger burn (input + output, incl. cache reads) and PAUSES
# new tickets once it crosses daily_token_budget, then resumes after midnight (or when you raise it).
daily_token_budget: 100000000   # tokens/day ceiling (0 = off). Tune to your Max-plan headroom — high
                                # enough that only a runaway loop hits it; a heavy legit day may pause.
budget_alert_pct: 0.8           # Telegram heads-up once today's burn crosses this fraction of the ceiling
budget_bad_threshold: 0.95      # Low-watermark: stop starting new tickets when any provider (Claude/GLM)
                                # reaches this utilization. Prevents starting a ticket you can't finish.
glm_quota_tokens: 100000000     # GLM (Z.ai) token quota ceiling; 0 = disabled. Enables dual-provider
                                # budget monitoring when using GLM as a fallback/alternative.

# --- how passing work lands on dev ---
merge_to_dev: true          # auto-merge feature -> dev when review passes AND dev stays green
open_pr_on_block: true      # if it can't merge cleanly (or dev would break), open a PR instead
mark_done_on_merge: false   # false = leave ticket In Progress for your manual QA; true = mark Done on dev-merge

# --- out-of-scope build findings (EU-42) ---
out_of_scope_autofile: false  # false = PROPOSE-FIRST: a finding outside the ticket's scope is proposed
                              # (de-duped) but NOT auto-filed into the backlog. Flip true to let filing.py
                              # open backlog tickets for out-of-scope findings automatically.

# --- opt-in extras (both OFF: extra cost/noise) ---
# scout_after_merge: false    # OFF: don't smoke-test DEV after each merge (extra QA-Engineer cost)
# meeting_autospawn: false    # OFF: meetings may PROPOSE tickets but never auto-file them (review-first)
# (Phase-2 §2: the events.py autonomy layer — auto-convened meetings/small-talk — was deleted;
#  ceremonies are on-demand only, so the old autonomy_* flags no longer exist.)

# --- safety ---
dry_run: true               # full loop incl. a trial merge, but NO push / merge / Jira writes
                            # flip per-run with --live
notify_verbose: false       # Telegram also on implemented / verdict / pushed (not just key events)

# --- isolation (so the General never collides with your own git checkout) ---
use_worktree: true          # run each app in a dedicated linked git worktree based on origin/<base>;
                            # the General builds + lands there (ff-push to origin/<base>) and never touches
                            # the branch / working tree you have checked out.
                            # Auto-falls back to in-tree if the repo has no origin remote.
sync_base_after_merge: true # after a green live merge, bring <base> in your main checkout up to date for QA
                            # (ff if you're on <base> & clean, else advance the ref; never clobbers dirty work)
# (Phase-2 §2: the LLM per-diff security gate was removed; secret/dep checks are deterministic in
#  gate.py now, and the weekly `general provost` security recon still runs. `security_gate` is gone.)
red_base_check: true        # Phase-2 §3.1 (the EU-174 killer): before the FIRST build pass, gate the CLEAN base
                            # tree; a red base BLOCKS the ticket (Telegram + Needs-you) instead of billing builds
                            # for a failure that predates the diff. Cached per base sha (state/red_base_cache.json)
# autofiled_quota_per_n: 0   # EU-784: limits how often self-filed tickets enter the build queue during drain.
                            # Value N = at most 1 autofiled pick per N consecutive picks (greedy, order-preserving).
                            # Commander tickets always bump past quota; if only autofiled remain, head emits anyway.
                            # 0 / absent = unlimited (backward-compatible). Set to e.g. 3 for 1-in-3 ratio.

# --- post-merge safety net (Sentinel) ---
sentinel_enabled: true      # ARMED: after a feature lands on <base>, Sentinel runs that app's `postmerge_commands`
                            # (below) on the landed branch. If they go RED it reverts the merge forward-only
                            # (git revert — no force-push, no history rewrite) and hands the ticket back, so DEV is
                            # never left runtime-broken. NO-OP for any app without a `postmerge_commands:` suite.
                            # Keep the suite NARROW + STABLE: a flaky test here triggers an auto-revert.
smoke_enabled: true         # ARMED (EU-60): after a land, run that app's single `smoke_command` (a fast post-merge
                            # canary, e.g. a Playwright auth-redirect smoke). Unlike Sentinel it NEVER reverts — on red
                            # it FLAGS the merge (Telegram + audit + ticket comment) so you catch a broken DEV at QA.
                            # NO-OP for any app without a `smoke_command:` (below), so arming it costs nothing.
postmerge_verify: false      # EU-453 master switch for the post-merge dev-HEAD re-verification runner
                             # (postmerge_verify.py): after a land, re-run the app's own `gate_commands` against the
                             # ACTUAL merged <base> HEAD and FLAG a red merge (audit + Telegram + Needs Human + ticket
                             # comment) — FLAG-ONLY, the merge STANDS, it NEVER auto-reverts (that's the Commander's
                             # call / the next pick's base gate). The post-land counterpart to the pre-land
                             # red_base_check: where that blocks a build on a red CLEAN base, this catches a merge
                             # that turns DEV red. Arms only when THIS master switch, a per-app `postmerge_verify:`
                             # (below), AND a non-empty `gate_commands` are ALL set — three factors (mirrors
                             # sentinel_enabled+postmerge_commands and smoke_enabled+smoke_command), so adding the
                             # field here costs nothing until an app opts in both ways.
# worktree_dir: "..."       # optional parent for worktrees (default: <repo_parent>/.general-worktrees/<app>)
# worktree_setup_cmd: "npm install"   # optional unit-wide default: run ONCE when a fresh worktree is created
                                      # (deps for the gate). A bun/npm/pnpm/yarn install auto-skips for an app
                                      # whose worktree has no package.json (e.g. a Python repo), and any app can
                                      # override this with its own per-app `worktree_setup_cmd:` (EU-54).

audit_path: "./state/audit.jsonl" # append-only log of every step; its directory is the runtime-state root (all sidecar state files live beside it) — keep outside your repos

# --- your unit of apps. Add one block per app/repo. ---
apps:
  - name: automatixy
    repo_path: "/Users/romanberlin/code/automatixy"
    base_branch: "dev"               # features branch off and merge back to dev
    protected_branch: "main"         # the General NEVER touches this — you merge dev->main
    branch_prefix: "autodev"
    gate_commands:                   # your own tests/lint/typecheck (run on the branch AND on dev)
      - "npm run lint"
      - "npx tsc --noEmit"           # typecheck (the old typecheck-only gate)
      # BOUNDED runtime net so typechecking-but-broken code can't auto-merge. vitest defaults to one
      # worker PER CPU CORE -> it can OOM/freeze the box; pin --pool=forks + a low maxForks. Keep it
      # FAST + STABLE (a slow/flaky gate stalls or bounces every build):
      - "npx vitest run --pool=forks --poolOptions.forks.maxForks=2"
    # Phase-2 §3.3: fast lint/format DETERMINISTIC gate — runs after the test gate and before
    # any LLM reviewer; failures feed the Builder as plain text. Keep it fast (seconds).
    # Python repos: ["ruff check ."]. Empty/omitted = no lint gate for this app.
    lint_commands: []
    # --- MONOREPO: per-app gates (EU-19) ---------------------------------------------------
    # If this repo is a monorepo (apps/<x>/, packages/<x>/), set per-app gate commands here.
    # The gate detects which apps/packages a ticket's diff touched and runs ONLY their gates
    # (each failure is reported by component name). A landing-page/microsite ticket is then
    # typechecked on landing-page + microsite and is NOT blocked by an unrelated zeltivo-crm
    # error. Detection falls back to the repo-wide `gate_commands` above when nothing under
    # apps/ or packages/ changed, or no touched component is configured here.
    gate_commands_by_app:
      zeltivo-crm:  ["cd apps/zeltivo-crm && bunx tsc -b --noEmit"]
      landing-page: ["cd apps/landing-page && bunx tsc -b --noEmit"]
      microsite:    ["cd apps/microsite && bunx tsc -b --noEmit"]
    # A changed shared package re-gates the apps that depend on it (so a shared dependency that
    # links two apps still typechecks both). Key = packages/<pkg> dir name; value = dependent apps.
    gate_shared_packages:
      ui: ["zeltivo-crm", "landing-page", "microsite"]
    # EU-249: diff-scoped test-collectability + test-run gate — for every ADDED/RENAMED
    # *.test.*/*.spec.* file in a diff, flags a phantom duplicated-app-root path
    # (apps/<x>/**/apps/<x>/, e.g. AUTO-101/AUTO-95) or a path matching none of its owning app's
    # vitest `include` globs, then runs the survivors with a scoped `bunx vitest run` — immune to
    # the pre-existing zeltivo-crm full-suite failures (AUTO-122) that keep that full-suite gate
    # dormant. This is the PRE-MERGE complement to that dormant post-merge gate, not a replacement.
    # False by default; only an app with this monorepo/vitest shape should opt in.
    test_collectability_enabled: true
    gate_timeout_sec: 900            # per-command hard cap (default 1800). Kills a hung/runaway test run.
                                     # EU-218: for THIS repo's own self-gate (`python3 tests/run_all.py`,
                                     # the EU app's gate_commands), keep the default 1800s — measured
                                     # full-suite wall-clock is ~214s (382 harnesses), an ~8.4x margin.
                                     # run_all.py prints WALL-CLOCK every run and warns if it creeps past
                                     # 50% of the budget (override with GENERAL_GATE_TIMEOUT_SEC); raise
                                     # this value deliberately (with a comment, as here) only if that
                                     # warning fires for real added work, not to paper over a hang.
    gate_env:                        # extra env for gate commands so tests can't exhaust RAM
      NODE_OPTIONS: "--max-old-space-size=3072"
    postmerge_commands:              # Sentinel's heavier post-merge net on the landed <base> (e2e/integration
                                     # that only makes sense after the code is actually on DEV). RAM-capped via
                                     # gate_env + bounded by gate_timeout_sec, same as the gate. Keep it NARROW
                                     # + STABLE — a red here auto-reverts the merge and hands the ticket back:
      - "npx vitest run --pool=forks --poolOptions.forks.maxForks=2"
      # EU-98: two-tenant LIVE tenant-isolation check on the just-landed DEV — proves a guard that
      # exists in code is actually evaluated in the right middleware position in the running stack
      # (only a live request catches a middleware-ordering error). ABSOLUTE paths are REQUIRED:
      # Sentinel runs postmerge_commands with cwd = THIS app's repo (automatixy), NOT the EU repo
      # where the script lives. A non-zero exit — an isolation breach (Tenant B reads Tenant A's
      # resource) OR a non-functional gate (Tenant A can't even read its OWN resource) — makes
      # gate.run_commands report RED, so sentinel.guard reverts the merge and blocks the ticket
      # going green. The EU venv interpreter is named explicitly because the script imports
      # `requests`. Tenant creds + the DEV URL are injected from the autopilot ENV, never hardcoded
      # (TENANT_A_EMAIL/TENANT_A_PASSWORD, TENANT_B_EMAIL/TENANT_B_PASSWORD, DEV_BASE_URL — put them
      # in .env alongside ANTHROPIC_API_KEY/JIRA_*):
      - "/Users/romanberlin/Projects/General/.venv/bin/python /Users/romanberlin/Projects/General/tests/two_tenant_smoke.py"
    # smoke_command: "npx playwright test e2e/auth-redirect.smoke.ts"   # EU-60: a single FAST post-merge
                                     # canary on the landed <base>. On red it FLAGS (Telegram + audit + ticket
                                     # comment) but never reverts — the auth-redirect smoke lives in the AUTO repo
                                     # under e2e/. Omit to skip (the smoke runner stays inert). Bounded by
                                     # gate_timeout_sec + gate_env, same as the gate.
    # postmerge_verify: true         # EU-453 per-app opt-in (second of three keys — needs the top-level
                                     # `postmerge_verify:` master switch AND a non-empty `gate_commands` above).
                                     # After a land, re-run THIS app's own `gate_commands` against the ACTUAL merged
                                     # <base> HEAD; a red merge is FLAGGED (audit + Telegram + Needs Human) but
                                     # NEVER auto-reverted. Use it for the repo whose own gate is the cheapest
                                     # reliable full-suite proxy (e.g. a Python repo's `tests/run_all.py`); leave it
                                     # off for an app whose gate is a narrow typecheck (a green typecheck says
                                     # little about whether the merged tree actually runs).
    backlog_backend: "jira"          # "jira" | "notion" | "none"
    backlog:
      base_url: "https://YOURTEAM.atlassian.net"
      project_key: "AUTO"
      ready_status: "To Do"          # the "ready" column drain pulls from
      queue_statuses: ["In Progress", "To Do"]   # work order: resume In Progress first, then To Do (each by board Rank)
      only_mine: true                # ...assigned to you (assignee = currentUser())
      # assignee: "70121:051c9744-..."  # pin the queue to a specific person's Jira accountId. Overrides
                                        # currentUser() — use this when the API token authenticates as a
                                        # DIFFERENT account than the person whose tickets you want worked.
      require_label: false           # set true (+ label) to also require a label
      label: "autodev"
      # jql: '<full JQL override; overrides the above>'
      acceptance_criteria_field: ""  # e.g. "customfield_10034"; blank = parse from description
      status_map:                    # logical -> your board's columns
        In Progress: "In Progress"
        Blocked: "Blocked"            # EU-61: a parked product decision round-trips through this column —
                                      # the unit moves the ticket here and posts the open question; you
                                      # answer in a comment (or Telegram) and it auto-resumes. Add a
                                      # "Blocked" column to the board first (with a transition back to
                                      # In Progress), or point this at an existing column you use for it.
        QA: "QA"                      # merged tickets land here for your review (pass->Done, fail->To Do)
        Needs Human: "Blocked"        # human-handoff states park in the Blocked column (visible), not In Progress
      # status_fallbacks:             # optional: per-target transition fallbacks when a column is absent.
      #   QA: ["Done", "Closed"]      # (this QA->Done/Closed chain is the built-in default)
        Done: "Done"
        Needs Human: "In Progress"

  # A second app with no tracker — drive it only with free-text `task` commands.
  # Also shows the Python-repo recipe (EU-54): pin the gate to the project venv interpreter so it
  # doesn't depend on the autopilot process's PATH, declare its import deps as a fast health check,
  # and run nothing on worktree creation (no package.json to install).
  - name: signaldesk
    repo_path: "/Users/romanberlin/code/signaldesk"
    base_branch: "dev"
    gate_commands: ["./.venv/bin/python -m pytest -q"]   # venv interpreter, not a bare `pytest`/`python3`
    gate_preflight: ["pytest"]        # modules the gate interpreter must import; a miss fails fast with a venv hint
    worktree_setup_cmd: ""            # explicitly install nothing for this app (no Node manifest)
    backlog_backend: "none"

# --- 2026-07 autonomy knobs (defaults shown; uncomment to change) ---
# planner_enabled: false        # ONE Opus design call/ticket before the build (Phase-2 centerpiece);
#                               # runs INSTEAD of the Architect when on
# planner_verdict_park: true    # a Planner CLOSE/ANSWER verdict with no code evidence parks the
#                               # ticket for you instead of building anyway (EU-375)
# builder_task_budget: 70000    # per-build SDK token budget, scaled by effort (EU-377); 0 = off.
#                               # Anthropic-only — GLM ignores the beta header, so GLM passes have
#                               # NO API-side budget; the in-pass brake below covers them instead.
# glm_pass_token_ceiling: 5000000  # EU-408: per-pass INPUT-token ceiling for GLM builder passes
#                               # (~5M). A GLM pass that crosses it is cut off cleanly and treated
#                               # like a turn-limit hit (split/boosted-retry ladder), with a
#                               # glm_token_ceiling audit event recording the burned tokens. GLM-only;
#                               # 0 disables. One unbounded pass burned 13.28M before any check fired.
# max_concurrent_builders: 1    # parallel build slots (EU-380). Leave at 1 on a 24GB Mac —
#                               # two Opus builders exhaust memory (measured 2026-07-18)
# self_update_auto_restart: true  # after the unit lands a change to ITSELF, exit gracefully once
#                                 # idle so the keepalive respawns onto the new code (EU-387)
# log_retention_days: 0         # auto-purge state/logs day-folders older than N days (0 = keep all)
